

name: GoRest Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest Production Monitor
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run ".github/workflows/2373401010431_LeTranHoaiThien_GoRest.postman_collection.json" \
            -e ".github/workflows/2373401010431_LeTranHoaiThien_GoRest_Env.postman_environment.json" \
            --folder Monitor_Cases \
            --env-var "BASEURL=https://gorest.co.in/public/v2" \
            --env-var "d970583ca665031f1b412c22ddc0857aa3d3a625007f9af3228785fad165df00" \
            --reporters cli
