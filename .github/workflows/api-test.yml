
name: GoRest API CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest API Tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run 2373401010431_LeTranHoaiThien_GoRest.postman_collection.json \
            -e 2373401010431_LeTranHoaiThien_GoRest_Env.postman_environment.json \
            -d users.csv \
            --folder "Positive_Cases" \
            --folder "Negative_Cases" \
            --env-var "BASEURL=https://gorest.co.in/public/v2" \
            --env-var "token=$GOREST_TOKEN" \
            --reporters cli \
            --bail failure
