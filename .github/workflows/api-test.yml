

name: GoRest API CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest API Tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run GoRest_Collection.json \
            -e GoRest_Enviroment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN" \
            --reporters cli
